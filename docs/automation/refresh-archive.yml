name: Refresh storm archive
on:
  workflow_dispatch:
  schedule:
    - cron: '25 10 * * 0,2,4'
permissions:
  contents: write
concurrency:
  group: archive-ingestion
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ingest.py
      - name: Commit refreshed archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh IBTrACS storm archive"
            git push
          fi
